name: Apply workspace hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-cyberfarm-phase1
          fetch-depth: 0

      - name: Apply workspace patch
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/workspace.patch
          git apply --check /tmp/workspace.patch
          git apply /tmp/workspace.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/WorkspacePage.tsx
          git commit -m 'Harden import flow and lazy-load heavy tools'
          git push origin HEAD:feature/native-cyberfarm-phase1
