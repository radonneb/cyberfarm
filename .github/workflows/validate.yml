name: Validate CyberFarm

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cyberfarm-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Grain Bunker formulas
        run: npm run verify:bunker

      - name: Build production application
        run: npm run build
