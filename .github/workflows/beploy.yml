name: Deploy CyberFarm to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cyberfarm-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Verify Grain Bunker formulas
        run: npm run verify:bunker

      - name: Build project
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cyberfarm-db --remote

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name cyberfarm --branch CyberFarm
