name: Apply CyberFarm hardening

on:
  push:
    branches:
      - feature/native-cyberfarm-phase1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-cyberfarm-phase1
          fetch-depth: 0

      - name: Apply reviewed hardening patch
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/cyberfarm-hardening.patch
          git apply --check /tmp/cyberfarm-hardening.patch
          git apply /tmp/cyberfarm-hardening.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden farm storage and pull request validation'
          git push origin HEAD:feature/native-cyberfarm-phase1
