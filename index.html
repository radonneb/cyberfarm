<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f2" />
    <meta
      name="description"
      content="CyberFarms field data workspace for ISOXML, guidance lines and Cloudflare project sharing."
    />
    <title>CyberFarms</title>
  </head>
  <body>
    <div id="root">
      <main
        data-cyberfarm-bootstrap
        style="min-height:100vh;display:grid;place-items:center;background:#031810;color:#eefaf4;font:600 15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      >
        <section style="max-width:560px;padding:28px;text-align:center">
          <strong style="display:block;font-size:22px;margin-bottom:8px">Loading CyberFarms…</strong>
          <span style="opacity:.72">Connecting to the application.</span>
        </section>
      </main>
    </div>
    <script>
      (() => {
        const showBootstrapError = (message) => {
          const target = document.querySelector('[data-cyberfarm-bootstrap]')
          if (!target) return
          target.innerHTML = `
            <section style="max-width:680px;padding:28px;text-align:center">
              <strong style="display:block;font-size:22px;margin-bottom:10px">CyberFarms failed to start</strong>
              <span style="display:block;opacity:.78;margin-bottom:12px">${String(message || 'The application JavaScript did not load.').replace(/[&<>\"']/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[character]))}</span>
              <small style="opacity:.58">Refresh with Cmd + Shift + R. If the message remains, send a screenshot of this text.</small>
            </section>`
        }

        window.addEventListener('error', (event) => {
          showBootstrapError(event.message || 'A JavaScript file could not be loaded.')
        })
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason instanceof Error ? event.reason.message : String(event.reason || '')
          showBootstrapError(reason || 'The application stopped during startup.')
        })
        window.setTimeout(() => {
          if (document.querySelector('[data-cyberfarm-bootstrap]')) {
            showBootstrapError('The application did not finish loading within 10 seconds.')
          }
        }, 10000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
